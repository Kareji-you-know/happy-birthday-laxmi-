<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Laxmi!</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

h1{
    color:white;
    font-size:3rem;
}

p{
    color:white;
    font-size:1.2rem;
}

.gifts{
    display:grid;
    grid-template-columns:repeat(2,150px);
    gap:20px;
    margin-top:30px;
}

.gift{
    width:150px;
    height:150px;
    background:#ff4d6d;
    border-radius:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:50px;
    cursor:pointer;
    transition:.3s;
}

.gift:hover{
    transform:scale(1.1);
}

#message{
    margin-top:30px;
    color:white;
    font-size:2rem;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>🎉 Happy Birthday Laxmi! 🎉</h1>
<p>Choose one of the 4 mystery gifts!</p>

<div class="gifts">
    <div class="gift" onclick="openGift()">🎁</div>
    <div class="gift" onclick="openGift()">🎁</div>
    <div class="gift" onclick="openGift()">🎁</div>
    <div class="gift" onclick="openGift()">🎁</div>
</div>

<div id="message"></div>

<script>
const jokes = [
    "😂 LOL! No gifts for you!",
    "🎁 Empty box. Better luck next year!",
    "🤣 Did you really think there was a gift?",
    "💀 Surprise! The gift budget was ₹0."
];

function openGift(){
    let random = jokes[Math.floor(Math.random()*jokes.length)];
    document.getElementById("message").innerHTML = random;
}
</script>

</body>
</html>
